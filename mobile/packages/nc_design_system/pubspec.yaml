name: nc_design_system
description: Thème, polices et composants visuels communs (identité de la refonte du 2026-11-24).
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Polices de l'identité (les mêmes que le site et le back-office), téléchargées depuis Google Fonts
# le 2026-11-24, licence SIL Open Font License. Figtree pour les titres, Noto Sans pour le texte,
# Noto Sans Arabic pour l'arabe (Figtree et Noto Sans n'ont pas de lettres arabes).
flutter:
  # Licences des polices (SIL OFL 1.1) : elles accompagnent chaque copie de l'application.
  assets:
    - fonts/OFL-Figtree.txt
    - fonts/OFL-NotoSans.txt
    - fonts/OFL-NotoSansArabic.txt
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
        - asset: fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: fonts/NotoSansArabic-Bold.ttf
          weight: 700
