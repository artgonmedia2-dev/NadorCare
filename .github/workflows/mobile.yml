name: Mobile

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Analyse et tests Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Les traductions générées sont à jour
        run: |
          (cd packages/nc_l10n && flutter gen-l10n)
          git diff --exit-code -- packages/nc_l10n/lib/src/generated \
            || (echo "::error::Traductions générées périmées : lancer 'flutter gen-l10n' dans mobile/packages/nc_l10n et commiter." && exit 1)

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: |
          for dir in packages/nc_api_client packages/nc_account apps/patient; do
            echo "::group::$dir"
            (cd "$dir" && flutter test)
            echo "::endgroup::"
          done
